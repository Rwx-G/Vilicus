# D28: the packages allowed to run code at build time, through a build script (build.rs) or as a
# procedural macro. ci/check_supply_chain.py fails naming any package of the dependency tree,
# workspace members included, that has such a target and is not listed here, and any entry that
# no such package matches.
#
# An entry is `<package name> = "<why its build-time code is accepted>"`. It is added in the same
# change as the dependency that brings the package, which needs owner approval (spine,
# Consistency Conventions, Dependencies).
[allowed]
# serde 1.0.229 with `derive`, for vilicus-types (Story 2.4): the closed vocabularies cross every
# socket and the client API by name, and `deny_unknown_fields` is a derive attribute.
serde = "build script runs `rustc --version`, prints cfg flags for older compilers and writes a private re-export module to OUT_DIR; no network, no file outside OUT_DIR"
serde_core = "build script runs `rustc --version`, prints cfg flags for older compilers and target atomics and writes a private module to OUT_DIR; no network, no file outside OUT_DIR"
serde_derive = "procedural macro behind serde's `derive` feature: expands #[derive(Serialize, Deserialize)] and #[serde(...)] attributes into impls at compile time"
proc-macro2 = "dependency of serde_derive; build script runs `rustc --version` and compiles a probe file into OUT_DIR to detect proc_macro_span support, then prints cfg flags"
quote = "dependency of serde_derive; build script runs `rustc --version` and prints one cfg flag for compilers before 1.78"
# dcbor 0.25.2 (D130), for vilicus-proto (Story 2.5), and the crates of its tree, chrono's
# platform crates included: the check judges every platform, so Windows, WebAssembly and Haiku
# crates are listed although Debian 13 never builds them.
paste = "procedural macro of dcbor that concatenates identifiers; its build script runs `rustc --version` and prints cfg flags. Unmaintained (RUSTSEC-2024-0436, deny.toml and ci/audit-exceptions.toml)"
thiserror = "dependency of dcbor; build script compiles a probe file with rustc into OUT_DIR to detect nightly backtrace support, prints cfg flags and writes a private module to OUT_DIR; no network"
thiserror-impl = "procedural macro behind thiserror's #[derive(Error)]: expands error enums into Display and Error impls at compile time"
zerocopy = "dependency of half, itself a dependency of dcbor; build script runs `rustc --version`, reads its own Cargo.toml and prints cfg flags; no network, no file written"
zerocopy-derive = "procedural macro of zerocopy: derives its byte-layout traits at compile time"
crunchy = "dependency of half; build script writes a generated lib.rs of unrolling macros to OUT_DIR and prints a rustc-env variable; no network"
num-traits = "dependency of chrono; build script uses autocfg to compile probe expressions with rustc into OUT_DIR and prints cfg flags"
libc = "dependency of chrono's platform crates and of cc's jobserver; build script runs `rustc --version` and prints cfg flags for the target; no network, no file written"
getrandom = "dependency of jobserver, which cc uses; build script reads CARGO_CFG_SANITIZE and prints one cfg flag; no network, no file written"
iana-time-zone-haiku = "dependency of chrono on Haiku only, never built for Debian; build script compiles one C++ file with cc into OUT_DIR and links libbe on Haiku"
windows-implement = "procedural macro of windows-core, on Windows only (chrono through iana-time-zone): expands COM interface implementations at compile time"
windows-interface = "procedural macro of windows-core, on Windows only (chrono through iana-time-zone): expands COM interface declarations at compile time"
wasm-bindgen = "dependency of chrono on WebAssembly only; build script prints cfg flags from the target and the compiler version; no network, no file written"
wasm-bindgen-macro = "procedural macro of wasm-bindgen, on WebAssembly only: expands #[wasm_bindgen] items at compile time"
wasm-bindgen-shared = "dependency of wasm-bindgen, on WebAssembly only; build script runs `git rev-parse HEAD` in its own directory to name the version, hashes its schema file and prints two rustc-env variables; no network, no file written"
rustversion = "procedural macro of wasm-bindgen's build script, on WebAssembly only; its own build script runs `rustc --version` and writes the parsed version to OUT_DIR"
# Dev-dependencies of vilicus-proto (Story 2.5): the E19 vector generator and its tests; aws-lc-rs
# is also one of vilicus-core (Story 3.6), for the E17 file inspection tests.
# Neither reaches a release artefact (ci/check_packaging.py).
serde_json = "dev-dependency of vilicus-proto, reads and writes the E19 vector files; build script prints cfg flags from the target architecture and pointer width; no network, no file written"
zmij = "dependency of serde_json; build script runs `rustc --version` and prints cfg flags; no network, no file written"
aws-lc-rs = "dev-dependency of vilicus-proto, SHA-256 of the E19 vector files, and of vilicus-core, AES-256-CBC decryption of module file pages in the E17 inspection tests (spine Stack, the version rustls 0.23.46 pulls); build script reads its features and target and prints cfg flags; no network, no file written"
aws-lc-sys = "dependency of aws-lc-rs; build script compiles the bundled AWS-LC C and assembly sources with cc into OUT_DIR and links them, with pregenerated bindings (no bindgen) and no cmake on Linux. It would link a system AWS-LC instead if one is found or AWS_LC_SYS_SYSTEM_DIR is set; none is in the pinned rust:1.99-trixie image (Story 2.5); no network"
# The fuzzing runtime of vilicus-fuzz (Story 2.7, owner approval), behind its `libfuzzer` feature,
# which only the nightly `fuzz` job enables. Never in a release artefact.
libfuzzer-sys = "fuzzing runtime of vilicus-fuzz; with its default `link_libfuzzer` feature, the build script compiles the bundled libFuzzer C++ sources (libfuzzer/*.cpp) with cc as C++17 into OUT_DIR and links them statically, or links the library CUSTOM_LIBFUZZER_PATH names when set (the fuzz job never sets it); no network"
# SQLite access for vilicus-storage (Story 3.1, spine Stack), with SQLCipher 4.19.0 compiled from the
# vendored amalgamation of crates/vilicus-storage/sqlcipher/ (D143).
libsqlite3-sys = "dependency of rusqlite with its `sqlcipher` and `bundled_bindings` features (no `bundled`): the build script copies the prebuilt bindings of its sqlcipher/ directory to OUT_DIR, probes pkg-config for a `sqlcipher` library (none in the pinned image or on the CI runner) and prints `rustc-link-lib=dylib=sqlcipher`, which resolves to the archive vilicus-storage builds; it compiles nothing, and its own SQLCipher 4.14.0 sources are not used; no network"
vilicus-storage = "first-party build script (build.rs): compiles crates/vilicus-storage/sqlcipher/sqlite3.c, checked against its SHA256SUMS by ci/check_sqlcipher_source.py, with the system C compiler (CC or cc) and a fixed list of defines into OUT_DIR, archives it with ar (AR or ar) as libsqlcipher.a and links it whole with the system libcrypto; reads no CFLAGS and no LIBSQLITE3_FLAGS; no network"
