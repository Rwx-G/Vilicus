# push-delivery configuration for the real E13 run (RUNBOOK.md). Copy it outside the
# repository, fill it in, and keep the copy out of git: it names your servers.
#
# Topics and tokens may be written as env:NAME so the file holds no secret.

# Where sends and acknowledgements are appended. Keep it on persistent storage.
results /var/lib/push-delivery/results.tsv
# The collector's address; phones post their acknowledgements to /ack on it.
listen 0.0.0.0:8080

# Mean time between two alerts to the same phone on the same server. Alerts follow a Poisson
# process, so nights get as many as days. 30 minutes gives about 336 alerts per phone and
# server over 7 days.
mean_interval_ms 1800000

# The D105 criterion. Any other value labels every report `criterion=simulation`.
deadline_ms 600000
window_ms 604800000
threshold_percent 99
# Fewer evaluated alerts than this makes a phone's result incomplete (spike choice).
min_alerts 100

# Night hours, to show that idle nights were measured: UTC offset in minutes, first hour,
# hour after the last. Here 00:00 to 06:00 at UTC+1.
night 60 0 6

# Optional: the CA that signed the self-hosted server's certificate, if it is not public.
# ca_file /etc/push-delivery/household-ca.pem

# One line per phone and server: anonymous label (phone-1, phone-2, ...), server kind
# (self-hosted or public), base URL, topic, token (or - for none). A topic without a token
# must be 128 random bits: generate it with `push-delivery new-topic`.
target phone-1 self-hosted https://push.internal.example.org env:TOPIC_P1_SELF env:TOKEN_SENDER
target phone-1 public https://ntfy.example.com env:TOPIC_P1_PUBLIC -
target phone-2 self-hosted https://push.internal.example.org env:TOPIC_P2_SELF env:TOKEN_SENDER
target phone-2 public https://ntfy.example.com env:TOPIC_P2_PUBLIC -
