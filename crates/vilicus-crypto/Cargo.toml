[package]
name = "vilicus-crypto"
description = "Vilicus key types, wrappers and key derivation, private to the Core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Not inherited from the workspace: unsafe code is allowed in this crate, denied at crate level
# and allowed per block with a `// SAFETY:` comment (D140; the crate list is in ci/crate_graph.toml).
# Every other workspace lint is repeated here at its workspace level; ci/check_workspace.py checks it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# `testing` compiles `vilicus_crypto::testing`, what the key memory regression harness needs (Story
# 4.2, AC10): keys planted from a file, the stack canary of the guarded calls, and the fork, signal
# and fault it inspects. Only test code enables it, through vilicus-core's `testing` feature;
# ci/check_packaging.py refuses it in the normal or build dependencies of a release artefact.
[features]
testing = []

[dependencies]
vilicus-types.workspace = true
# The cryptographic library of the spine's Stack (aws-lc-rs with its aws-lc-sys backend, D28),
# at the version and features the workspace pins; its first runtime use is SHA-256 (Story 3.7),
# then AES-256-GCM key wrapping and HKDF-SHA-256 derivation (Story 4.1).
aws-lc-rs.workspace = true
# Key buffers wiped on drop (spine AD-4, Stack), at the version Cargo.lock already holds.
zeroize.workspace = true
# The system calls of the key memory (Story 4.2, D131: mmap, mprotect, madvise, mlock, prctl,
# setrlimit, the SIGTERM signalfd), at the version and features the workspace pins (owner
# approval): a new edge to a package Cargo.lock already holds.
libc.workspace = true

# The key memory regression harness of Story 4.2 (AC2, AC9, AC10), run by ci/key_memory.py in
# containers given the capabilities and limits each check needs; never a test of `cargo test`,
# which runs without them.
[[example]]
name = "key_memory"
required-features = ["testing"]
