# Configuration of the simulated run (run.sh). Shortened criterion: every report computed from
# it is labelled `criterion=simulation` and is not an E13 result.
results /var/lib/push-delivery/results.tsv
listen 0.0.0.0:8080
mean_interval_ms 300
deadline_ms 3000
window_ms 40000
threshold_percent 99
min_alerts 100
night 0 0 6

# The self-hosted server protects each topic with an access token (write-only for the sender,
# read-only for the one phone); the public server relies on 128-bit random topic names.
target phone-1 self-hosted http://ntfy-self env:TOPIC_P1_SELF env:TOKEN_SENDER
target phone-2 self-hosted http://ntfy-self env:TOPIC_P2_SELF env:TOKEN_SENDER
target phone-1 public http://ntfy-public env:TOPIC_P1_PUBLIC -
target phone-2 public http://ntfy-public env:TOPIC_P2_PUBLIC -
