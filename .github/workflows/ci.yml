name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  # Weekly, so that an advisory published after a merge fails a run without waiting for a change.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Each merge gate of doc/architecture-spine.md AD-33 is its own job, so a gate is added as a job
# without touching the others. Every job installs the toolchain rust-toolchain.toml names. Cargo
# tools come from .github/actions/cargo-tool at the versions of the spine's Stack table, which
# ci/test_check_supply_chain.py compares with the `with:` blocks below.
jobs:
  workspace-policy:
    name: Crate graph, manifests and unsafe code (AD-3, D29)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Test the workspace and supply-chain checks
        run: python3 -m unittest discover -s ci -v
      - name: Run the workspace checks
        run: python3 ci/check_workspace.py
      - name: Check build scripts, procedural macros and duplicate exceptions (D28)
        run: python3 ci/check_supply_chain.py
      - name: Check vendor/ against Cargo.lock (D28)
        run: python3 ci/check_supply_chain.py --vendor
      - name: Check the vendored SQLCipher source against its hashes (D143)
        run: python3 ci/check_sqlcipher_source.py
      - name: Check that no release artefact carries test code (FR-109, D102)
        run: python3 ci/check_packaging.py
      - name: Check that every release gate carries a target tag (FR-109)
        run: python3 ci/release_gates.py check

  # Clippy enforces the `// SAFETY:` comment D140 requires on each unsafe block (Story 2.1 AC5).
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --frozen --config ci/cargo-vendored.toml -- -D warnings

  # --frozen is --locked without the network, and ci/cargo-vendored.toml replaces crates.io by
  # vendor/: third-party crates can only come from there.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --workspace --frozen --config ci/cargo-vendored.toml
      - name: Test
        run: cargo test --workspace --frozen --config ci/cargo-vendored.toml

  deny:
    name: Licences, duplicates, advisories and sources (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-deny
          version: 0.20.2
      - name: cargo deny
        run: cargo deny --locked check

  # --locked uses supply-chain/imports.lock and fetches no new audit.
  vet:
    name: Audited dependencies (cargo vet)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-vet
          version: 0.10.2
      - name: cargo vet
        run: cargo vet --locked

  audit:
    name: Security advisories (cargo audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-audit
          version: 0.22.2
      # `cargo audit --deny warnings` with reasoned exceptions: the JSON report is judged by
      # ci/check_audit_report.py, which fails on every vulnerability and on every warning not
      # listed in ci/audit-exceptions.toml (Story 2.5, AC8). A crashed cargo-audit leaves no JSON,
      # which fails the check.
      - name: cargo audit
        run: |
          cargo audit --json > "$RUNNER_TEMP/audit.json" || true
          python3 ci/check_audit_report.py ci/audit-exceptions.toml "$RUNNER_TEMP/audit.json"

  # Story 2.7 (AD-12, AD-13, D130): every fuzz target of fuzz/ for a fixed time, seeded from the
  # E19 vectors and the committed failing inputs, under memory limits derived from the frame
  # maximum and the item bound of its socket kind. libFuzzer and AddressSanitizer need a nightly
  # toolchain, pinned by date here and used by this job only; rust-toolchain.toml stays on
  # stable, and build-and-test replays the committed failing inputs without any fuzzing
  # dependency. A finding fails the job and is never retried: ci/fuzz.py prints each failing
  # input as hex, and the upload keeps the inputs for the commit that fixes them.
  fuzz:
    name: Coverage-guided fuzzing of vilicus-proto (D130)
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      FUZZ_TOOLCHAIN: nightly-2026-10-01
      FUZZ_OUT: ${{ github.workspace }}/fuzz-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      # AC1 from the compiler's view of the public API (rustdoc JSON, nightly only), after the
      # source scan of fuzz/tests/coverage.rs that build-and-test runs on stable.
      - name: Check that every public decoder has a fuzz target
        run: python3 ci/check_fuzz_coverage.py --toolchain "$FUZZ_TOOLCHAIN"
      # 60 seconds per target on pull requests, pushes, the merge queue and manual runs; 20
      # minutes per target on the weekly schedule.
      - name: Fuzz every target
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1200' || '60' }}
        run: python3 ci/fuzz.py --toolchain "$FUZZ_TOOLCHAIN" --seconds "$FUZZ_SECONDS" --out "$FUZZ_OUT"
      # Also on a cancelled run, a job timeout included, so that a finding is never lost.
      - name: Upload the failing inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: ${{ env.FUZZ_OUT }}/artifacts
          if-no-files-found: warn

  # D61, D120: the RFC 9180 vector, the cross-test and the other checks of the HPKE spike, plus
  # an advisory gate on its lockfile (gate HPKE-3). The job always runs and ci/must_run.py filters
  # paths inside it: a workflow-level `paths` filter would leave a required check pending on every
  # other pull request. Without a change under the watched paths, the steps are skipped and the
  # job passes; on schedule and workflow_dispatch they always run.
  hpke-review:
    name: HPKE spike vectors and cross-test (D61, D120)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect a change under the watched paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          watched=(spikes/hpke-review .github/workflows/ci.yml .github/actions/cargo-tool ci/must_run.py ci/check_audit_report.py)
          run="$(python3 ci/must_run.py --event "$EVENT" --base "$BASE" "${watched[@]}")"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "run the HPKE spike: ${run}"
      - name: Run the HPKE spike
        if: steps.changes.outputs.run == 'true'
        run: bash spikes/hpke-review/run.sh
      - name: Install the pinned toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install
      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-audit
          version: 0.22.2
      # `cargo audit --deny warnings` with reasoned exceptions: cargo-audit cannot except a single
      # yanked crate, so its JSON report is judged by ci/check_audit_report.py, which fails on every
      # vulnerability and on every warning not listed in spikes/hpke-review/audit-exceptions.toml.
      # A crashed cargo-audit leaves no JSON, which fails the check.
      - name: Advisories on the spike lockfile
        if: steps.changes.outputs.run == 'true'
        run: |
          cargo audit --file spikes/hpke-review/Cargo.lock --json > "$RUNNER_TEMP/hpke-audit.json" || true
          python3 ci/check_audit_report.py spikes/hpke-review/audit-exceptions.toml "$RUNNER_TEMP/hpke-audit.json"

  # D143: regenerates the vendored SQLCipher amalgamation from its official release tag and
  # compares it byte for byte with the committed files, which ci/check_sqlcipher_source.py only
  # checks against SHA256SUMS. Path-filtered inside the job like hpke-review, so it stays a
  # required check; it always runs on the weekly schedule and on manual runs. The pinned build
  # image clones the tag, the only network access, and the checkout is mounted read-only.
  sqlcipher-regenerate:
    name: SQLCipher amalgamation regenerated from its tag (D143)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect a change under the watched paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          watched=(crates/vilicus-storage/sqlcipher .github/workflows/ci.yml ci/must_run.py ci/check_sqlcipher_source.py)
          run="$(python3 ci/must_run.py --event "$EVENT" --base "$BASE" "${watched[@]}")"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "regenerate the SQLCipher amalgamation: ${run}"
      - name: Regenerate the amalgamation and compare it with the committed files
        if: steps.changes.outputs.run == 'true'
        run: docker run --rm -v "$PWD:/w:ro" -w /w rust:1.99-trixie@sha256:e259494b14672950a909b4c54527e19d29cae6ebf980672114c8bb85e5594e4a bash crates/vilicus-storage/sqlcipher/regenerate.sh

  # Story 2.3 (AD-33): the Debian 13 VM harness of ci/vm/README.md, not yet a required check. It
  # boots the cloud image of e2e/vm/IMAGE.lock with QEMU and KVM, systemd as PID 1, and runs the
  # built binary, the smoke unit, a privileged systemd container and the release gates of Story
  # 2.6 in the guest. The first step
  # after the checkout checks nested virtualisation, as root because QEMU opens /dev/kvm as root
  # in the e2e/vm container. The base image is cached by IMAGE.lock and verified against its
  # SHA512 on every boot, so a stale or altered cache entry fails the boot.
  vm-smoke:
    name: Debian 13 VM smoke test (AD-33)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VM_CPUS: "2"
      VM_MEMORY_MIB: "4096"
      VM_DISK_SIZE: 20G
      # In the workspace rather than runner.temp, which job-level env cannot read, so that the
      # always() steps have their paths even when the first check fails.
      VM_IMAGES_DIR: ${{ github.workspace }}/.vm-images
      VM_RESULTS: ${{ github.workspace }}/vm-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check nested virtualisation
        run: sudo python3 ci/vm_harness.py check-kvm
      - name: Restore the Debian cloud image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VM_IMAGES_DIR }}
          key: debian-cloud-image-${{ hashFiles('e2e/vm/IMAGE.lock') }}
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # One build per artefact of ci/release_gates.py, the shipped vilicus first, then the testbed
      # (vilicus-testbed and the test doubles), so that they never share a build.
      - name: Build the package and testbed artefacts
        run: python3 ci/release_gates.py build
      - name: Boot the Debian 13 VM
        id: up
        timeout-minutes: 20
        run: python3 ci/vm_harness.py up
      - name: Copy the binary into the guest
        run: python3 ci/vm_harness.py copy target/debug/vilicus
      # GUEST_COMMAND is one shell string, expanded by the guest's shell, not by this step's.
      - name: Run the binary in the guest
        timeout-minutes: 10
        env:
          GUEST_COMMAND: '~/artefacts/vilicus; status=$?; echo "vilicus exited $status on $(. /etc/os-release && echo "$PRETTY_NAME")"; exit $status'
        run: python3 ci/vm_harness.py run --log "$VM_RESULTS/vilicus-run.log" -- "$GUEST_COMMAND"
      # AC2: a guest command's exit status must reach the job unchanged.
      - name: Check that the guest exit status reaches the job
        timeout-minutes: 5
        run: |
          status=0
          python3 ci/vm_harness.py run -- 'exit 3' || status=$?
          echo "run -- 'exit 3' returned ${status}"
          test "$status" -eq 3
      # Runs after a failed run step too, so the AC3 journals are still collected, but only on a
      # booted VM.
      - name: Smoke unit and privileged systemd container
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 15
        run: python3 ci/vm_harness.py smoke --out "$VM_RESULTS"
      # FR-109: each release gate of ci/release_gates.toml against the artefact its tag names,
      # package gates before the testbed artefact reaches the guest.
      - name: Release gates against the package and testbed artefacts (FR-109)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 15
        run: python3 ci/release_gates.py run --out "$VM_RESULTS/release-gates"
      - name: Collect the guest facts and console
        if: always()
        run: python3 ci/vm_harness.py collect --out "$VM_RESULTS"
      - name: Upload the VM results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-smoke-results
          path: ${{ env.VM_RESULTS }}
          if-no-files-found: error
      - name: Stop the VM
        if: always()
        run: python3 ci/vm_harness.py down
