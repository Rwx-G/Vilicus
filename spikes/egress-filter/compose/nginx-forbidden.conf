# The forbidden upstream (203.0.113.11, 2001:db8:113::11). Every request it logs is a bypass
# unless it came from a control check run without the proxy.
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
  log_format marker '$remote_addr "$request" proto=$server_protocol sni=$ssl_server_name host=$host status=$status';
  access_log /dev/stdout marker;
  default_type text/plain;
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/egress-test/forbidden.crt;
    ssl_certificate_key /etc/egress-test/forbidden.key;
    error_page 497 =200 /__identity;
    location = /__identity { return 200 "upstream=forbidden\n"; }
    location / { return 200 "upstream=forbidden host=$host sni=$ssl_server_name\n"; }
  }
}
