[package]
name = "vilicus-core"
description = "Vilicus Core: pipeline, policy, tokens, registry, bus, journal, keys and timers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Not inherited from the workspace: unsafe code is allowed in this crate, denied at crate level
# and allowed per block with a `// SAFETY:` comment (D140; the crate list is in ci/crate_graph.toml).
# Every other workspace lint is repeated here at its workspace level; ci/check_workspace.py checks it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
vilicus-types.workspace = true
vilicus-proto.workspace = true
vilicus-module-api.workspace = true
vilicus-crypto.workspace = true
vilicus-storage.workspace = true

# Test code only: the registry tests build real FTS5 tables in a module file without the
# authorizer, as Story 3.7's migrations will, which no storage handle can before that story.
[dev-dependencies]
rusqlite.workspace = true
