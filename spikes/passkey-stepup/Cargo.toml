[package]
name = "passkey-stepup"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Spike E2 login half (story 1.5): passkey login and a step-up bound to one action hash on webauthn-rs"

# Standalone on purpose: the spike never joins the Vilicus workspace (Epic 2 creates it).
[workspace]

[dependencies]
# The design's WebAuthn library at the spine's pin. `danger-allow-state-serialisation` is the only
# way 0.5.5 offers to put a caller-chosen challenge into an authentication state (see
# `src/stepup.rs`); the state never leaves the server.
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }
# Story 1.9's AD-13 profile, by path: the action hash is its canonical encoding and SHA-256.
canonical-cbor = { path = "../canonical-cbor" }
# Builds the canonical action map; the same pin as canonical-cbor.
dcbor = { version = "=0.25.2", default-features = false, features = ["std"] }
# Smallest HTTP layer on hyper with JSON extraction; the spine's pin.
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# TLS 1.3 server, aws-lc-rs provider, the spine's pins.
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
# Already in the tree through rustls; named for the CSPRNG and SHA-256 of the challenge derivation.
aws-lc-rs = "1"
# Test CA and server certificate only.
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# Required by webauthn-rs's JSON types; already in its tree.
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.154"
