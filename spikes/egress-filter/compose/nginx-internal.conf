# The internal target (10.77.0.10, fd00:77::10, and 203.0.113.20 as the household's public
# address). Port 8443 stands for a named private destination (D105), such as a push server.
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
  log_format marker '$remote_addr:$server_port "$request" sni=$ssl_server_name host=$host status=$status';
  access_log /dev/stdout marker;
  default_type text/plain;
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    listen 80;
    ssl_certificate /etc/egress-test/internal.crt;
    ssl_certificate_key /etc/egress-test/internal.key;
    error_page 497 =200 /__identity;
    location = /__identity { return 200 "upstream=internal\n"; }
    location / { return 200 "upstream=internal\n"; }
  }
}
