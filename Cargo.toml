[workspace]
resolver = "3"
members = ["crates/*", "testing/*", "fuzz"]
# Each spike is a standalone package with its own lockfile and never joins the workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Kept equal to the channel of rust-toolchain.toml; ci/check_workspace.py fails when they differ.
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/Rwx-G/Vilicus"
publish = false

# AD-9, D131: release builds unwind on panic, so the Core catches a module's panic at the boundary
# of its call and a module never takes the Core down; vilicus-core refuses to compile otherwise.
[profile.release]
panic = "unwind"

# Every crate inherits these lints except the crates where D140 allows unsafe code, listed once
# under [unsafe_code] in ci/crate_graph.toml; ci/check_workspace.py fails when any other crate
# stops inheriting them.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# Workspace crates depend on each other by path only; the allowed edges are in ci/crate_graph.toml.
[workspace.dependencies]
vilicus-types = { path = "crates/vilicus-types" }
vilicus-proto = { path = "crates/vilicus-proto" }
vilicus-crypto = { path = "crates/vilicus-crypto" }
vilicus-storage = { path = "crates/vilicus-storage" }
vilicus-module-api = { path = "crates/vilicus-module-api" }
vilicus-core = { path = "crates/vilicus-core" }
vilicus-gateway = { path = "crates/vilicus-gateway" }
vilicus-audit = { path = "crates/vilicus-audit" }
vilicus-egress = { path = "crates/vilicus-egress" }
vilicus-ai = { path = "crates/vilicus-ai" }
vilicus-plugin-sdk = { path = "crates/vilicus-plugin-sdk" }
vilicus-mod-reference = { path = "testing/vilicus-mod-reference" }
# Third-party crates at the versions of the spine's Stack table; each one needs owner approval and
# passes the supply-chain gates of D28 (ci/check_supply_chain.py, cargo deny, vet and audit).
serde = { version = "1.0.229", features = ["derive"] }
# Canonical CBOR of AD-13 and D130, for vilicus-proto (Story 2.5). `dcbor` without its default
# features: `std` alone, no big integers, hash maps or spin locks. `unicode-normalization` is
# pinned exactly because its Unicode version is part of the canonical form (D130).
dcbor = { version = "=0.25.2", default-features = false, features = ["std"] }
unicode-normalization = { version = "=0.1.25", default-features = false }
# serde_json is a dev-dependency of vilicus-proto only (Story 2.5, owner approval), reading and
# writing the E19 vector files. aws-lc-rs is the version rustls 0.23.46 resolves to (spine Stack),
# with only its `aws-lc-sys` backend: a dev-dependency of vilicus-proto and vilicus-core for their
# tests, and since Story 3.7 a dependency of vilicus-crypto, through which the Core hashes at run
# time (AD-3).
serde_json = "=1.0.154"
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["aws-lc-sys"] }
# The libFuzzer runtime of the fuzz targets in fuzz/ (Story 2.7, owner approval), behind that crate's
# optional `libfuzzer` feature, which only the nightly `fuzz` job enables: the stable builds never
# compile it, and Cargo.lock, vendor/ and the supply-chain gates still cover it.
libfuzzer-sys = "=0.4.13"
# SQLite access for vilicus-storage (Story 3.1, spine Stack). `sqlcipher` links the SQLCipher
# library that vilicus-storage's build script compiles from crates/vilicus-storage/sqlcipher/,
# instead of the 4.14.0 amalgamation `bundled-sqlcipher` would compile (D143). `modern_sqlite`
# takes the bindings and API surface `bundled-sqlcipher` implied, `hooks` the authorizer and
# `backup` the online backup API of the maintenance connection; no feature brings a crate. The
# registry tests of vilicus-core use it as a dev-dependency, to build real FTS5 tables in a test
# file outside the authorizer (Story 3.2 review).
rusqlite = { version = "=0.40.2", default-features = false, features = ["sqlcipher", "modern_sqlite", "hooks", "backup"] }
# Key buffers wiped on drop (spine AD-4, Stack).
zeroize = "=1.9.1"
# The statvfs call of vilicus-storage's maintenance path (Story 3.7, AD-23), at the version
# Cargo.lock already holds, without its default `std` feature, which the call does not need.
libc = { version = "=0.2.191", default-features = false }
