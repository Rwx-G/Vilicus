[package]
name = "browser-device-key"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Spike E22: browser device key, OPAQUE-bound pairing codes and signed light confirmations"

# Standalone on purpose: the spike never joins the Vilicus workspace (Epic 2 creates it).
[workspace]

[dependencies]
# ECDSA P-256 verify, SHA-256, HKDF and HMAC, as AD-18 takes its primitives from aws-lc-rs.
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["aws-lc-sys", "alloc"] }
# The PAKE AD-21 names, the version story 1.3 names. Default features: ristretto255 and serde.
# `argon2` gives the KSF the browser package `@serenity-kit/opaque` 1.1.0 uses, so a Rust client
# in the tests computes the same envelope as the WASM client.
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
# The hash of the key exchange of `@serenity-kit/opaque` (TripleDh<Ristretto255, Sha512>); the
# digest 0.10 line opaque-ke 4.0.1 is generic over.
sha2 = "=0.10.9"
# opaque-ke takes a rand_core 0.6 RNG; OsRng needs the getrandom feature.
rand_core = { version = "=0.6.4", features = ["getrandom"] }
# The canonical CBOR profile of story 1.9 (AD-13), reused by path and not modified.
canonical-cbor = { path = "../canonical-cbor" }
dcbor = { version = "=0.25.2", default-features = false, features = ["std"] }
# HTTPS server: tokio, hyper 1 (the spine's line) over rustls. rustls is one patch above the
# spine's 0.23.45, which `cargo audit` flags (RUSTSEC-2026-0346 to 0349, fixed in 0.23.46).
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
# Test CA and server certificate for the compose network only.
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# JSON bodies and the URL-safe base64 the browser package uses for OPAQUE messages.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"

# Argon2id at 64 MiB runs in every pairing test; optimised dependencies keep the tests fast.
[profile.dev.package."*"]
opt-level = 3
