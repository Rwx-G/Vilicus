# nginx terminating TLS for both origins of the nginx instance names and forwarding each port to
# the Gateway's matching plain listener. The certificate is chosen by SNI from the PKI volume.
# `$http_host` keeps the port the browser used; `$host` would drop it and the Gateway would refuse
# the content origin's requests as misdirected.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
    access_log /dev/stdout;

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /pki/$ssl_server_name.crt;
        ssl_certificate_key /pki/$ssl_server_name.key;
        location / {
            proxy_pass http://10.89.0.10:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /pki/$ssl_server_name.crt;
        ssl_certificate_key /pki/$ssl_server_name.key;
        location / {
            proxy_pass http://10.89.0.10:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
