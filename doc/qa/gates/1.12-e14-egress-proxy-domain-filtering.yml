top_issues:
  - id: 'E14-1'
    severity: high
    finding: 'Domain fronting by SNI or Host header carries requests to another tenant of a shared front end; the per-caller SNI check closes the SNI half, Host-header fronting stays open (R54, T67).'
    suggested_action: 'D134 Accepted (2026-10-18): Story 5.5 builds the SNI and ECH check, and the allowlist review requires a stated reason for an entry on a front end that does not refuse a Host differing from SNI. The gate stays FAIL against the story criterion; the residual risk is accepted.'
  - id: 'E14-2'
    severity: low
    finding: 'Resolved on 2026-10-17: on a Debian 13 VM (kernel 6.12.111, systemd 257 as PID 1, AppArmor active) the 25 ac3.* checks passed in the sandbox container and the same matrix passed 22 of 22 under the guest systemd with systemd-run.'
    suggested_action: 'Story 5.5 keeps the matrix as a VM test.'
  - id: 'E14-3'
    severity: medium
    finding: 'getaddrinfo consults the hosts file and name service modules, and a timed-out lookup keeps its thread.'
    suggested_action: 'Story 5.5 uses an asynchronous resolver that queries only the configured DNS servers, with cancellation.'
  - id: 'E14-4'
    severity: low
    finding: 'File descriptor exhaustion and Encrypted Client Hello end to end were not exercised.'
    suggested_action: 'Story 5.5 runs the LimitNOFILE=64 procedure of the story.'
  - id: 'E14-5'
    severity: medium
    finding: 'Docker Compose 2.26 (Debian 13) starts every logs line with ESC [2K even into a pipe; the anchored logs.* checks then failed (internal target) or passed vacuously (forbidden upstream count 0). run.sh now strips the escape on every log read (uncommitted at the time of this gate; 189 PASS in the VM and on Docker Desktop).'
    suggested_action: 'Commit the run.sh change; Story 5.5 tests read service logs through one filtered helper.'
