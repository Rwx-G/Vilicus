[package]
name = "canonical-cbor"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Spike E19: canonical CBOR (AD-13 profile) cross-checked between dcbor and the TypeScript cbor2 package"

# Standalone on purpose: the spike never joins the Vilicus workspace (Epic 2 creates it).
[workspace]

[dependencies]
# The crate under evaluation (story 1.9 decision task): it encodes deterministically and
# rejects non-canonical input natively. Licence BSD-2-Clause-Patent, compatible with Apache-2.0.
dcbor = { version = "=0.25.2", default-features = false, features = ["std"] }
# Already in dcbor's tree; named directly for hex in the vector files.
hex = "=0.4.3"
sha2 = "=0.11.1"
# Already in dcbor's tree (its NFC tables); named directly so the vector files state the
# Unicode version the Rust side normalizes with.
unicode-normalization = { version = "=0.1.25", default-features = false }
# Reads and writes the language-neutral vector files.
serde_json = "=1.0.154"

[profile.dev.package."*"]
opt-level = 3
