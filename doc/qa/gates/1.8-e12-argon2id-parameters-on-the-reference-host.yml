top_issues:
  - id: 'E12-1'
    severity: high
    finding: 'Measured on a CPU quota of a 24-core desktop, not on 4 physical cores; Argon2id is bound by memory bandwidth, so the reference host will be slower by an unmeasured factor.'
    suggested_action: 'Run E12_HOST=reference bash spikes/argon2id-params/run.sh on the reference host and follow the story procedure.'
  - id: 'E12-2'
    severity: high
    finding: 'D128 (two-thread Argon2id pool with parallel lanes) conflicts with D136 (lanes on one blocking-pool thread, no parallel feature).'
    suggested_action: 'Owner settles D128, D129 and D136 together, then E12 and E32 run on the reference host in one session.'
  - id: 'E12-3'
    severity: medium
    finding: 'No known third-party audit of the argon2 crate; the parallel feature pulls rayon as new Core dependencies (D129 Proposed).'
    suggested_action: 'Owner decides D129.'
  - id: 'E12-4'
    severity: low
    finding: 'The story records 11 PASS for its final run while naming 10 checks; this campaign shows 10.'
    suggested_action: 'Correct the count in the story Result.'
  - id: 'E12-5'
    severity: medium
    finding: 'In the Debian 13 VM (4 dedicated vCPUs of the desktop CPU, no CFS quota over 24 cores) selection_matches_constant failed in both runs: the rule picked m = 512 MiB (slower-of-pair median 907.7 and 784.5 ms, under the 1 000 ms emulation margin) against the constant 384 MiB. The pick depends on the machine, as the story already showed under contention.'
    suggested_action: 'Keep the constant until the reference host run, which decides it with the margin removed; do not tune it on a VM.'
