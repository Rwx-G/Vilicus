top_issues:
  - id: 'E16-1'
    severity: medium
    finding: 'Not run on the reference host (FR-13 consequence). Run on 2026-10-17 on a Debian 13 VM (kernel 6.12.111+deb13-cloud-amd64, AppArmor active): same outcomes as on the WSL2 kernel 6.18.'
    suggested_action: 'Run spikes/locked-memory/run.sh on the reference host.'
  - id: 'E16-2'
    severity: low
    finding: 'Resolved on 2026-10-17: under the systemd-coredump pipe on Debian 13 the hardened subjects leave no coredumpctl entry; per run the list shows the control (COREFILE present) and the RLIMIT_CORE-only subject (COREFILE none: the kernel pipes the image whatever the limit, systemd-coredump does not store it). With a pipe, core-file-excludes-locked-pool cannot run (no file in the working directory) and the stored control core was not scanned.'
    suggested_action: 'Story 4.2 keeps PR_SET_DUMPABLE 0 as the barrier, never LimitCORE=0 alone; optionally scan the stored control core with coredumpctl dump in the regression test.'
  - id: 'E16-3'
    severity: medium
    finding: 'The pass holds only under the D131 rules (pool, stack scrub, per-operation key objects, Core-owned Argon2id memory); the default shape leaves HPKE schedule values and keys behind.'
    suggested_action: 'Story 4.2 reuses the inspection method as a regression test on the product build.'
  - id: 'E16-4'
    severity: medium
    finding: 'A privileged systemd container of another spike (sandbox, egress) applied Debian 10-coredump-debian.conf to the host and set kernel.core_pattern to core, so a campaign silently tested the file case on a pipe host; the masked systemd-sysctl in those images fixes it (uncommitted at the time of this gate; verified in the VM, pipe intact after both phases).'
    suggested_action: 'Commit the image changes; the locked-memory phase prints core_pattern, and the QA report checks it against the host value.'
  - id: 'E16-5'
    severity: low
    finding: 'The swap group needs swap: on the swapless Debian 13 VM it fails harness-swap (subject killed under its 256 MiB limit before reporting); with a 2 GiB swap file both swap checks pass.'
    suggested_action: 'Give the swap group a precondition check that reports SKIP with the reason when the host has no swap.'
