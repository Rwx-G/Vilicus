# The Debian 13 (trixie) cloud image the e2e VM boots. Sourced by entrypoint.sh, which
# downloads the file once into a Docker volume, checks that the published SHA512SUMS still
# lists this exact checksum for this file, and verifies the file against it on every boot.
# To move to a newer build: pick a dated directory under
# https://cloud.debian.org/images/cloud/trixie/, copy the genericcloud amd64 qcow2 line of its
# SHA512SUMS here, and record the change in the QA report that uses it.
