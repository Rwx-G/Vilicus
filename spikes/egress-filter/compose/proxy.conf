# Proxy configuration of the E14 test network (format: src/config.rs).
# The simulated internet uses documentation ranges; nothing else can be unblocked.
documentation-ranges-public
header-timeout 3
# The proxy host's own public addresses and the household's public address (AD-16).
blocked 203.0.113.2/32
blocked 2001:db8:113::2/128
blocked 203.0.113.20/32
# A network-specific NAT64 prefix (RFC 6052), judged like 64:ff9b::/96.
nat64-prefix 2a00:64::/96
caller-connections 64

caller core kind=core uid=2000
caller plugin-a kind=plugin uid=2001
caller plugin-b kind=plugin uid=2002
caller backup kind=backup uid=2003
# A plugin whose allowlist names hosts that resolve to internal addresses: the address check
# must refuse them although the names are allowlisted.
caller misconfigured kind=plugin uid=2004

allow core allowed.test:443
allow core budget.test:443
private core push.lan:8443 10.77.0.10/32
private backup push.lan:8443 10.77.0.10/32

allow plugin-a allowed.test:443
allow plugin-a allowed6.test:443
allow plugin-a budget.test:443
allow plugin-a rebind-a.test:443
allow plugin-a rebind-b.test:443

allow plugin-b other.test:443
allow plugin-b budget.test:443
# plugin-b's first TLS record must name the CONNECT host, without Encrypted Client Hello.
sni-check plugin-b

allow misconfigured internal.test:443
allow misconfigured mixed.test:443
allow misconfigured loopback.test:8443
allow misconfigured zero.test:8443
allow misconfigured metadata.test:80
allow misconfigured cgnat.test:443
allow misconfigured mcast.test:443
allow misconfigured bench.test:443
allow misconfigured mapped.test:443
allow misconfigured mapped-loopback.test:8443
allow misconfigured nat64.test:443
allow misconfigured sixtofour.test:443
allow misconfigured teredo.test:443
allow misconfigured ula.test:443
allow misconfigured linklocal6.test:443
allow misconfigured loopback6.test:8443
allow misconfigured mcast6.test:443
allow misconfigured household.test:443
allow misconfigured self.test:443
allow misconfigured push.lan:8443
allow misconfigured nsp64.test:443

# Shared by every caller that reaches the host; one tunnel of each window is reserved for the
# Core and the backup caller. Every other host takes the default budget.
budget budget.test tunnels=6 window=600 reserve=1
budget-default tunnels=2000 window=600 reserve=100
