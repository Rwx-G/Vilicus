# Spike E2 login half: the relying party and the browser drivers on one private compose network.
# The server answers as `rp.vilicus.test`, the origin's host and the RP ID, so the browsers reach
# it by a real host name over TLS. run.sh starts `server`, then runs each driver once.
# Every image is pinned by digest (tags as pulled on 2026-10-16 in the comments).

x-images:
  # rust:1-trixie (Debian 13), the image the crate is built in.
  rust: &rust_image rust@sha256:e259494b14672950a909b4c54527e19d29cae6ebf980672114c8bb85e5594e4a

volumes:
  # Built by run.sh's check step; read-only here.
  target:
    external: true
    name: vilicus-passkey-stepup-target
  # The test CA of this run only; `down --volumes` deletes it.
  pki: {}

services:
  server:
    image: *rust_image
    command: ["/target/release/passkey-stepup", "serve", "0.0.0.0:8443", "/pki", "rp.vilicus.test", "${STEP_UP_TTL_MS:?}"]
    networks:
      default:
        aliases: [rp.vilicus.test]
    volumes:
      - target:/target:ro
      - pki:/pki
    healthcheck:
      test: ["CMD", "test", "-s", "/pki/ca.pem"]
      interval: 1s
      retries: 60

  browsers-current:
    profiles: [browsers]
    build:
      context: browser
      args:
        # mcr.microsoft.com/playwright:v1.64.1-noble; browser/current pins the same npm version.
        BASE: mcr.microsoft.com/playwright@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
        LOCK_DIR: current
    image: vilicus-e2-browsers-current
    ipc: host
    volumes:
      - pki:/pki:ro

  browsers-previous:
    profiles: [browsers]
    build:
      context: browser
      args:
        # mcr.microsoft.com/playwright:v1.63.0-noble; browser/previous pins the same npm version.
        BASE: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
        LOCK_DIR: previous
    image: vilicus-e2-browsers-previous
    ipc: host
    volumes:
      - pki:/pki:ro
