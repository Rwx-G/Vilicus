# The crate dependency graph of doc/architecture-spine.md AD-3, read by ci/check_workspace.py.
#
# AD-3 is the source. Node ids and edges are those of its Mermaid flowchart, and a test
# (ci/test_check_workspace.py) fails when this file and the flowchart disagree, so a change to
# the graph is made in the spine first, then here.
#
# A node matches workspace crates by exact name (`crates`), by manifest directory relative to
# the repository root (`paths`) or by name pattern (`pattern`), tried in that order.
# `depends_on` lists the node's edges. A crate may depend on any crate it reaches through
# these edges, except that a `private` node accepts only its direct dependents (D140). A
# `dev_only` node is reached from a node with an edge to it, or through a dev-dependency from a
# node that already reaches everything the dev-only node depends on, and never sits in the
# normal or build closure of a `shipped` node. A `required` node is a crate of Story 2.1 AC1 or
# Story 2.6 AC1: the check fails when no workspace crate matches it.

[node.types]
required = true
crates = ["vilicus-types"]

[node.proto]
required = true
crates = ["vilicus-proto"]
depends_on = ["types"]

[node.modapi]
required = true
crates = ["vilicus-module-api"]
depends_on = ["types"]

[node.mods]
pattern = "vilicus-mod-*"
depends_on = ["modapi"]

[node.crypto]
required = true
crates = ["vilicus-crypto"]
depends_on = ["types"]
private = true

[node.storage]
required = true
crates = ["vilicus-storage"]
depends_on = ["types"]
private = true

[node.core]
required = true
crates = ["vilicus-core"]
depends_on = ["proto", "modapi", "crypto", "storage"]

[node.gw]
required = true
crates = ["vilicus-gateway"]
depends_on = ["proto"]

[node.aud]
required = true
crates = ["vilicus-audit"]
depends_on = ["proto"]

[node.egr]
required = true
crates = ["vilicus-egress"]
depends_on = ["proto"]

[node.ai]
required = true
crates = ["vilicus-ai"]
depends_on = ["proto"]

[node.sdk]
required = true
crates = ["vilicus-plugin-sdk"]
depends_on = ["proto"]

[node.plugins]
pattern = "vilicus-plugin-*"
depends_on = ["sdk"]

[node.bin]
required = true
crates = ["vilicus"]
depends_on = ["core", "mods", "gw", "aud", "egr", "ai"]
shipped = true

# The test doubles are named vilicus-double-<role>, so that a double stays dev-only, like the
# reference module, wherever its directory is.
[node.testing]
required = true
crates = ["vilicus-mod-reference"]
paths = ["testing"]
pattern = "vilicus-double-*"
depends_on = ["core"]
dev_only = true

[node.testbed]
required = true
crates = ["vilicus-testbed"]
depends_on = ["core", "testing"]

# Crates outside the AD-3 graph, which no workspace crate may depend on by any kind of edge
# (normal, build or dev). An `[isolated.<id>]` table matches crates by exact name (`crates`) or
# manifest directory (`paths`), tried before the nodes, and `depends_on` lists the nodes its
# crates may depend on, with what those nodes reach, except a `private` node it does not list. It
# is not a node: nothing reaches it, and the AD-3 flowchart does not show it. The packages in
# `exclusive_dependencies` are reached by the table's crates alone: no other workspace crate may
# depend on one, by any kind of dependency, directly or through registry crates.
#
# Story 2.7, AC5: the fuzz targets of vilicus-proto, never a dependency of a shipped crate.
[isolated.fuzz]
crates = ["vilicus-fuzz"]
paths = ["fuzz"]
depends_on = ["proto"]
# The fuzzing runtime and its dependency (owner approval, Story 2.7), never in a shipped crate.
exclusive_dependencies = ["libfuzzer-sys", "arbitrary"]

# Packages that only the named workspace crates may declare as a dependency, each crate with its
# reason: `linked` names those that may take the package as a normal or build dependency, `dev`
# those that may take it as a dev-dependency. Any other declaration fails the check, whatever
# its kind. Reaching a package through a registry crate is not a declaration and is not checked
# here: the Gateway reaching aws-lc-rs through rustls is allowed (Story 4.1 review, finding 5).
#
# Spine AD-4 and FR-13: every key type is defined in vilicus-crypto and wipes its buffer when
# dropped, with `zeroize`, the one dependency of the Stack that wipes memory reliably where
# unsafe code is forbidden; a crate that would define a key type elsewhere fails here instead.
[restricted.zeroize.linked]
vilicus-crypto = "defines every key type, each wiped on drop"

# AD-4, AD-18, D28 and D131: key operations run in vilicus-crypto, where their objects live for
# one operation; a crate that used a primitive source directly could hold a key outside it.
[restricted.aws-lc-rs.linked]
vilicus-crypto = "AES-256-GCM, HKDF-SHA-256 and SHA-256 of the suite (AD-18)"

[restricted.aws-lc-rs.dev]
vilicus-proto = "SHA-256 of the canonical CBOR vector files in its tests (Story 2.5)"
vilicus-core = "decrypts the pages of a module file for the file inspection of its tests (Story 3.6, E17)"

[restricted.hpke.linked]
vilicus-crypto = "HPKE of the household key wraps and sealed inbox rows (AD-18, D120)"

[restricted.argon2.linked]
vilicus-crypto = "Argon2id KEKs, derived into a buffer the Core owns and wipes (AD-18, D128, D129)"

[restricted.opaque-ke.linked]
vilicus-crypto = "the OPAQUE server of pairing codes, whose server setup holds a private key (AD-4, D123)"

# The passphrase-strength library of D113 is still to choose; zxcvbn is the candidate this rule
# anticipates. It reads the candidate passphrase, which stays where the derivation is.
[restricted.zxcvbn.linked]
vilicus-crypto = "the strength check of a candidate passphrase, which never leaves the derivation (FR-7, D113)"

# D140 and the spine's Consistency Conventions, Unsafe code. The crates in `allowed` are the
# only ones where unsafe code may appear: each denies unsafe_code at crate level and denies
# clippy's undocumented_unsafe_blocks, instead of inheriting [workspace.lints]. Every other
# workspace crate inherits [workspace.lints], where unsafe_code is forbidden. Crates matching a
# `forbid_attribute` pattern also carry #![forbid(unsafe_code)] in every crate root. Adding a
# crate to `allowed` needs a decision record first (D140).
[unsafe_code]
allowed = ["vilicus-crypto", "vilicus-storage", "vilicus-core", "vilicus-gateway"]
forbid_attribute = ["vilicus-mod-*", "vilicus-plugin-*", "vilicus-double-*"]

# D140 and Story 4.2 AC3: in each crate of `allowed`, unsafe code lives in one module of FFI
# wrappers that expose safe functions, the file `<module>.rs` and the files under `<module>/`
# (paths relative to the crate's directory). Outside these modules the `unsafe` keyword appears
# nowhere in the workspace, tests and examples included; a crate of `allowed` without an entry
# holds none yet, and names its module here with the story that adds its first block.
[unsafe_code.modules]
vilicus-crypto = "src/memory"
vilicus-storage = "src/ffi"
