top_issues:
  - id: 'E13-1'
    severity: high
    finding: 'No measurement: every verdict of the run is computed with simulation parameters and labelled criterion=simulation; the story stays in-progress.'
    suggested_action: 'Run the 7-day measurement with spikes/push-delivery/RUNBOOK.md on each household phone and both server kinds.'
  - id: 'E13-2'
    severity: medium
    finding: 'A push server stores the alert body, so a token in the payload is readable by its operator. Settled on 2026-10-18 by D135: no token in the payload, a published endpoint with per-phone read-only tokens or the WireGuard tunnel off the household network.'
    suggested_action: 'Story 8.1 implements D135; E13 measures both reachability paths on mobile data; settle how the test notification proves receipt (research-notes section 4).'
  - id: 'E13-4'
    severity: low
    finding: 'Emulator run: Doze, standby buckets and reboots did not delay the ntfy app (its foreground service keeps the network; forced buckets revert to active), outages delay by their length and lose nothing, a force-stopped app receives nothing until reopened; the app also logs and stores the message body on the device.'
    suggested_action: 'Real run: record whether a phone vendor force-stops the app; story 1.13 proposed update 6 is covered by D135 (Accepted).'
  - id: 'E13-3'
    severity: medium
    finding: 'A run made only at home would overstate delivery; the acknowledgement path through an automation app is part of the measured delay.'
    suggested_action: 'Follow the runbook: reach the server and collector over mobile data before the run, and use --explain to separate late from missing.'
