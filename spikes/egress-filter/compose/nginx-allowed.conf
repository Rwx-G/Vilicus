# The allowed upstream (203.0.113.10, 2001:db8:113::10): HTTP/1.1, HTTP/2 and HTTP/3, redirects
# off the allowlist, a websocket, and a large download. Plain HTTP sent to the TLS port is
# answered with the upstream's name (error 497), which the probe uses to tell who it reached.
worker_processes 2;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  log_format marker '$remote_addr "$request" proto=$server_protocol sni=$ssl_server_name host=$host status=$status bytes=$bytes_sent';
  access_log /dev/stdout marker;
  default_type text/plain;
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;
    ssl_certificate /etc/egress-test/allowed.crt;
    ssl_certificate_key /etc/egress-test/allowed.key;
    error_page 497 =200 /__identity;
    location = /__identity { return 200 "upstream=allowed\n"; }
    location = /redirect-forbidden { return 302 https://forbidden.test/; }
    location = /redirect-ip { return 302 https://203.0.113.11/; }
    location = /big.bin { root /srv; }
    location = /big.sha256 { root /srv; }
    location = /ws {
      proxy_pass http://127.0.0.1:9000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
    location / { return 200 "upstream=allowed host=$host sni=$ssl_server_name proto=$server_protocol\n"; }
  }
}
